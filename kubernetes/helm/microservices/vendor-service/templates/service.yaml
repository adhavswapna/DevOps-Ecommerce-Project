
apiVersion: v1
kind: Service
metadata:
  name: vendor-service
  namespace: ecommerce-dev
  labels:
    app: vendor-service
spec:
  type: {{ .Values.service.type }}
  selector:
    app: vendor-service
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
