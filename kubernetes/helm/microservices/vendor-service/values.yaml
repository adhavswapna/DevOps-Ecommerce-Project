replicaCount: 1

image:
  repository: vendor-service
  tag: dev
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: vendor-service
  automount: true
  annotations: {}

service:
  type: ClusterIP
  port: 3012
  targetPort: 3012

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  nodeEnv: development
  kafkaBroker: kafka:9092
  kafkaClientId: vendor-service
  enableKafka: "true"
