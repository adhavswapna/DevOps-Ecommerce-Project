apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: user-service-secret
  namespace: ecommerce-dev

spec:
  type: kv-v2

  mount: ecommerce
  path: user-service

  vaultAuthRef: user-service

  hmacSecretData: true

  refreshAfter: 1m

  destination:
    name: user-service-secret
    create: true
