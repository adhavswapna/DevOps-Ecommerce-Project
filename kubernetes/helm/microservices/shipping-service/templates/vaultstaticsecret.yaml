apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: shipping-service-secret
  namespace: ecommerce-dev
spec:
  type: kv-v2
  mount: ecommerce
  path: shipping-service

  vaultAuthRef: shipping-service

  hmacSecretData: true

  refreshAfter: 1m

  destination:
    name: shipping-service-secret
    create: true
