apiVersion: v1
kind: ConfigMap
metadata:
  name: invoice-service-config
  namespace: {{ .Release.Namespace }}
data:
  NODE_ENV: {{ .Values.env.NODE_ENV | quote }}
  PORT: {{ .Values.env.PORT | quote }}

  KAFKA_BROKER: {{ .Values.env.KAFKA_BROKER | quote }}
  KAFKA_CLIENT_ID: {{ .Values.env.KAFKA_CLIENT_ID | quote }}
  KAFKA_GROUP_ID: {{ .Values.env.KAFKA_GROUP_ID | quote }}
  ENABLE_KAFKA: {{ .Values.env.ENABLE_KAFKA | quote }}

  MINIO_ENDPOINT: {{ .Values.env.MINIO_ENDPOINT | quote }}
  MINIO_PORT: {{ .Values.env.MINIO_PORT | quote }}
  MINIO_BUCKET: {{ .Values.env.MINIO_BUCKET | quote }}
  MINIO_USE_SSL: {{ .Values.env.MINIO_USE_SSL | quote }}

  ORDER_SERVICE_URL: {{ .Values.env.ORDER_SERVICE_URL | quote }}
  USER_SERVICE_URL: {{ .Values.env.USER_SERVICE_URL | quote }}

  JWT_EXPIRES_IN: {{ .Values.env.JWT_EXPIRES_IN | quote }}
