replicaCount: 1

image:
  repository: search-service
  tag: dev
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3013
  targetPort: 3013

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  nodeEnv: development

  databaseUrl: postgresql://postgres:postgres@postgres:5432/search_db

  kafkaBroker: kafka:9092
  kafkaClientId: search-service
  enableKafka: "true"
