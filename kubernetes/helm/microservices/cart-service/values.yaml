replicaCount: 1

image:
  repository: cart-service
  tag: local
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3005
  targetPort: 3005

serviceAccount:
  create: true
  name: cart-service
  automount: true
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  nodeEnv: development
  kafkaBroker: kafka:9092
  kafkaClientId: cart-service
  enableKafka: "true"
  redisHost: redis
  redisPort: "6379"
  jwtExpiresIn: "7d"
