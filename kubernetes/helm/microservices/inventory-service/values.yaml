replicaCount: 1

image:
  repository: inventory-service
  tag: dev
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3009
  targetPort: 3009

serviceAccount:
  create: true
  name: inventory-service
  automount: true
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  nodeEnv: development

  kafkaBroker: kafka:9092
  kafkaClientId: inventory-service
  enableKafka: "true"

  redisHost: redis
  redisPort: "6379"

  jwtExpiresIn: "7d"
