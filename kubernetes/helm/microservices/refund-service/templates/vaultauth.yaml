{{- if .Values.vault.enabled }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: refund-service-auth
  namespace: {{ .Release.Namespace }}
spec:
  vaultConnectionRef: vault-connection

  method: kubernetes

  mount: kubernetes

  kubernetes:
    role: {{ .Values.vault.role }}
    serviceAccount: {{ include "refund-service.serviceAccountName" . }}
    audiences:
      - vault
{{- end }}
