fullnameOverride: kafka

image:
  registry: docker.io
  repository: bitnamilegacy/kafka
  tag: 4.0.0-debian-12-r10
  pullPolicy: IfNotPresent

listeners:
  client:
    containerPort: 9092
    protocol: PLAINTEXT
    name: CLIENT

  controller:
    containerPort: 9093
    protocol: PLAINTEXT
    name: CONTROLLER

  interbroker:
    containerPort: 9094
    protocol: PLAINTEXT
    name: INTERNAL

  external:
    containerPort: 9095
    protocol: PLAINTEXT
    name: EXTERNAL

sasl:
  enabledMechanisms: PLAIN
  interBrokerMechanism: PLAIN
  controllerMechanism: PLAIN

  interbroker:
    user: inter_broker_user
    password: ""

  controller:
    user: controller_user
    password: ""

  client:
    users:
      - user1
    passwords: ""

tls:
  enabled: false

controller:
  replicaCount: 1
  controllerOnly: false

  persistence:
    enabled: true
    storageClass: standard
    size: 2Gi

  logPersistence:
    enabled: false

broker:
  replicaCount: 0
